openapi: 3.0.0
info:
  title: Seller Analytics Dashboard API
  description: API for retrieving key metrics, products, campaigns, and competitor data for a seller's dashboard.
  version: 1.0.0

servers:
  - url: /api
    description: Development Server

paths:
  /products:
    get:
      summary: Retrieve a list of top products.
      description: Fetches a list of key products with their performance metrics.
      responses:
        '200':
          description: A list of products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          description: Server error.

  /campaigns:
    get:
      summary: Retrieve a list of marketing campaigns.
      description: Fetches a list of active and paused marketing campaigns with their performance data.
      responses:
        '200':
          description: A list of campaigns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Campaign'
        '500':
          description: Server error.

  /competitors:
    get:
      summary: Retrieve a list of tracked competitors.
      description: Fetches a list of competitors and their product ranking data.
      responses:
        '200':
          description: A list of competitors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Competitor'
        '500':
          description: Server error.

components:
  schemas:
    Product:
      type: object
      description: A product with performance metrics.
      properties:
        id:
          type: string
          description: The unique identifier for the product.
          readOnly: true
        name:
          type: string
          description: The name of the product.
        category:
          type: string
          description: The product's category.
        marketplace:
          type: string
          description: The marketplace where the product is sold.
        description:
          type: string
          description: A brief description of the product.
        icon:
          type: string
          description: A Unicode emoji representing the product.
        image:
          type: string
          format: uri
          description: A URL for the product's image.
        conversionRate:
          type: string
          description: The conversion rate as a percentage string (e.g., "5.2%").
        revenue:
          type: string
          description: The revenue generated by the product as a formatted string (e.g., "$15,400").
        isOnline:
          type: boolean
          description: Indicates if the product is currently live and available.
        badges:
          type: array
          description: A list of badges or key selling points.
          items:
            type: string
      example:
        id: "prod-1"
        name: "Wireless Ergonomic Mouse"
        category: "Electronics"
        marketplace: "Amazon"
        description: "High-comfort mouse for long work sessions."
        icon: "🖱️"
        image: "https://images.unsplash.com/photo-1577979607632-680459521798?q=80&w=2940&auto=format&fit=crop"
        conversionRate: "5.2%"
        revenue: "$15,400"
        isOnline: true
        badges: ["Best Seller", "FBA", "Prime"]

    Campaign:
      type: object
      description: A marketing campaign with performance metrics.
      properties:
        id:
          type: string
          description: The unique identifier for the campaign.
          readOnly: true
        name:
          type: string
          description: The name of the campaign.
        platform:
          type: string
          description: The advertising platform used.
        status:
          type: string
          description: The current status of the campaign.
        icon:
          type: string
          description: A Unicode emoji representing the campaign.
        spend:
          type: string
          description: The total ad spend.
        roas:
          type: string
          description: The Return on Ad Spend (ROAS) as a formatted string (e.g., "3.2x").
      example:
        id: "camp-1"
        name: "Q3 Product Launch"
        platform: "Amazon Ads"
        status: "Active"
        icon: "🚀"
        spend: "$500"
        roas: "3.2x"

    Competitor:
      type: object
      description: A competitor's tracked product.
      properties:
        id:
          type: string
          description: The unique identifier for the competitor entry.
          readOnly: true
        name:
          type: string
          description: The name of the competitor company.
        product:
          type: string
          description: The name of the tracked product.
        marketplace:
          type: string
          description: The marketplace where the competitor's product is found.
        rank:
          type: string
          description: The product's ranking.
        icon:
          type: string
          description: A Unicode emoji representing the competitor.
      example:
        id: "comp-1"
        name: "Tech Innovations Inc."
        product: "Ultra-Slim Mouse"
        marketplace: "Amazon"
        rank: "3"
        icon: "🏢"

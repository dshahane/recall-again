openapi: 3.0.3
info:
  title: Workflow API
  description: API for managing, initializing, loading, saving, and running user workflows.
  version: 1.0.0

servers:
  - url: https://api.yourdomain.com
    description: Production server

paths:
  /initialize:
    post:
      summary: Initialize a new workflow based on a theme.
      description: Generates a new, basic workflow object based on a provided theme.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializeRequest'
      responses:
        '200':
          description: A new workflow object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          description: Invalid theme provided.

  /load:
    post:
      summary: Load and validate a workflow from a string.
      description: Validates and parses a raw JSON string into a structured workflow object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadRequest'
      responses:
        '200':
          description: The validated workflow object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          description: Invalid workflow data string.

  /save:
    post:
      summary: Save a workflow.
      description: Processes and stores the current workflow state, returning a human-readable summary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workflow'
      responses:
        '200':
          description: A summary of the saved workflow.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Workflow 'Initial Query' saved successfully."
        '500':
          description: Internal server error.

  /run:
    post:
      summary: Simulate running a workflow.
      description: Executes a simulation of the workflow and returns a step-by-step log of the process.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workflow'
      responses:
        '200':
          description: The execution log of the workflow.
          content:
            application/json:
              schema:
                type: object
                properties:
                  log:
                    type: string
                    example: "Starting workflow. Step 1: Execute Initial Query..."
        '400':
          description: Invalid workflow data.

components:
  schemas:
    InitializeRequest:
      type: object
      required:
        - theme
      properties:
        theme:
          type: string
          description: A brief theme to guide the workflow generation.
          example: "data pipeline"

    LoadRequest:
      type: object
      required:
        - workflowString
      properties:
        workflowString:
          type: string
          description: The raw JSON string of the workflow to be loaded.
          example: '{"nodes":[{"id":"1","kind":"query","name":"Initial Query","pos":{"x":100,"y":100}}],"edges":[]}'

    Workflow:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
          description: An array of all nodes in the workflow.
        edges:
          type: array
          items:
            $ref: '#/components/schemas/Edge'
          description: An array of all edges connecting the nodes.

    Node:
      type: object
      required:
        - id
        - kind
        - name
        - pos
      properties:
        id:
          type: string
          description: A unique identifier for the node.
          example: "node-123"
        kind:
          type: string
          description: The type of the node (e.g., 'query', 'filter').
          example: "query"
        name:
          type: string
          description: The display name of the node.
          example: "User Data Filter"
        pos:
          $ref: '#/components/schemas/Position'
          description: The position of the node on the canvas.
        config:
          type: object
          description: Configuration data specific to the node type.

    Edge:
      type: object
      required:
        - id
        - source
        - target
      properties:
        id:
          type: string
          description: A unique identifier for the edge.
          example: "edge-123"
        source:
          type: string
          description: The ID of the source node.
          example: "node-123"
        target:
          type: string
          description: The ID of the target node.
          example: "node-456"

    Position:
      type: object
      required:
        - x
        - y
      properties:
        x:
          type: number
          description: The x-coordinate of the position.
          example: 250
        y:
          type: number
          description: The y-coordinate of the position.
          example: 300
